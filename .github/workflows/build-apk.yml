name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android_app/**", ".github/workflows/build-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and create the Android project
        working-directory: android_app
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build the APK
        working-directory: android_app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tapo-watch-apk
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
