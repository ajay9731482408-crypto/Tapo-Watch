<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1418">
<title>Tapo Watch</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1418;color:#e7ecea;
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
  main{width:min(380px,100%);display:grid;gap:14px;text-align:center}
  h1{margin:0;font-size:24px;letter-spacing:-.02em}
  p{margin:0;color:#85999d}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #22383f;background:#111f25;color:#e7ecea;font:inherit;min-height:48px}
  button{padding:13px 16px;border-radius:12px;border:0;background:#f2b84b;color:#1a1405;font:inherit;font-weight:600;min-height:48px}
  button.ghost{background:#172b33;color:#e7ecea;border:1px solid #22383f}
  :focus-visible{outline:2px solid #f2b84b;outline-offset:2px}
  #err{color:#ff5a47;min-height:1.5em}
</style>
<main>
  <svg width="88" height="88" style="margin:0 auto" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd978"/><stop offset=".55" stop-color="#f2b84b"/><stop offset="1" stop-color="#d4922a"/></linearGradient></defs><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" fill="url(#lgA)" stroke="url(#lgA)" stroke-width="1.2" stroke-linejoin="round"/><circle cx="12" cy="11.6" r="4.7" fill="#0b1418"/><circle cx="12" cy="11.6" r="3.75" fill="none" stroke="#f2b84b" stroke-width=".5" opacity=".9"/><circle cx="12" cy="11.6" r="2.3" fill="#1b3a45"/><circle cx="12" cy="11.6" r="1.05" fill="#ff5a47"/><circle cx="11.2" cy="10.8" r=".45" fill="#fff" opacity=".85"/></svg>
  <h1>Tapo Watch</h1>
  <div id="setup" hidden>
    <p>Enter the address of the computer running Tapo Watch.</p>
    <p style="font-size:13px;margin:6px 0 14px">Example: 192.168.1.25:5000</p>
    <input id="addr" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="192.168.1.25:5000" aria-label="Server address">
    <p id="err" role="alert"></p>
    <button id="go">Save and open</button>
  </div>
  <div id="splash" hidden>
    <p>Connecting to <b id="where"></b></p>
    <button class="ghost" id="change" style="margin-top:14px">Change address</button>
  </div>
</main>
<script>
  var KEY = "tapo_watch_server";
  var $ = function (id) { return document.getElementById(id); };
  var timer;
  function clean(v) {
    v = (v || "").trim().replace(/\/+$/, "");
    if (!v) return "";
    if (!/^https?:\/\//i.test(v)) v = "http://" + v;
    return v;
  }
  function openIt(url) { location.href = url; }
  function showSetup(msg) {
    clearTimeout(timer);
    $("splash").hidden = true; $("setup").hidden = false;
    $("addr").value = (localStorage.getItem(KEY) || "").replace(/^http:\/\//, "");
    $("err").textContent = msg || "";
  }
  $("go").onclick = function () {
    var u = clean($("addr").value);
    if (!/^https?:\/\/[^\s\/]+(:\d+)?$/i.test(u)) { $("err").textContent = "That doesn't look like an address. Try 192.168.1.25:5000"; return; }
    localStorage.setItem(KEY, u); openIt(u);
  };
  $("addr").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  $("change").onclick = function () { showSetup(); };
  var saved = localStorage.getItem(KEY);
  if (saved) {
    $("where").textContent = saved.replace(/^https?:\/\//, "");
    $("splash").hidden = false;
    timer = setTimeout(function () { openIt(saved); }, 1500);
  } else { showSetup(); }
</script>
</html>
